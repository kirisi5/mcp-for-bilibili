version: "3.9"

services:
  bili-mcp:
    build: .
    container_name: bili-cognitive-server
    ports:
      - "${MCP_SERVER_PORT:-8000}:8000"
    environment:
      - BILI_SESSDATA=${BILI_SESSDATA}
      - BILI_BILI_JCT=${BILI_BILI_JCT}
      - BILI_BUVID3=${BILI_BUVID3}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: bili-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  redis-data:
